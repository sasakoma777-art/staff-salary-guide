<title>スタッフ給与設計ガイド</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@400;700&display=swap">
<style>
/* Layout: a book you page through. Cover screen -> single-column paged reader (CSS columns, translateX), running header + bottom bar. */
:root {
  --bg: #f1f4f8;
  --paper: #ffffff;
  --ink: #1d2430;
  --muted: #667085;
  --head: #1f3a5f;
  --accent: #e8833a;
  --line: #f0c9a8;
  --tint: #eef2f7;
  --tint-line: #c9d3e2;
  --btn-bg: #1f3a5f;
  --btn-fg: #ffffff;
  --th-bg: #1f3a5f;
  --th-fg: #ffffff;
  --rule: #dfe3ea;
  --shadow: 0 12px 32px rgba(31, 58, 95, .16);
  --fs: 17px;
  --serif: "Noto Serif JP", "Hiragino Mincho ProN", "Yu Mincho", "BIZ UDPMincho", serif;
  --sans: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", "Meiryo", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e131a; --paper: #151c26; --ink: #e6e9ef; --muted: #9aa4b5; --head: #a9c1e6;
    --accent: #f09a5a; --line: #6b4a31; --tint: #1c2634; --tint-line: #34425a;
    --btn-bg: #f09a5a; --btn-fg: #1b1109; --th-bg: #2a4670; --th-fg: #ffffff; --rule: #2a3342;
    --shadow: 0 12px 32px rgba(0, 0, 0, .5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e131a; --paper: #151c26; --ink: #e6e9ef; --muted: #9aa4b5; --head: #a9c1e6;
  --accent: #f09a5a; --line: #6b4a31; --tint: #1c2634; --tint-line: #34425a;
  --btn-bg: #f09a5a; --btn-fg: #1b1109; --th-bg: #2a4670; --th-fg: #ffffff; --rule: #2a3342;
  --shadow: 0 12px 32px rgba(0, 0, 0, .5);
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); -webkit-text-size-adjust: 100%; overflow: hidden; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* ---------- cover screen ---------- */
.home { height: 100%; overflow-y: auto; display: flex; }
.home-inner { margin: auto; width: min(100%, 520px); padding: 28px max(20px, env(safe-area-inset-left, 0px)) 36px; display: flex; flex-direction: column; align-items: center; text-align: center; }
.home-cover { width: auto; height: auto; max-width: min(300px, 68vw); max-height: 42vh; border-radius: 3px; box-shadow: var(--shadow); }
.home-title { margin: 26px 0 0; font-size: 1.3rem; line-height: 1.6; font-weight: 700; color: var(--head); text-wrap: balance; }
.home-sub { margin: 8px 0 0; font-size: .95rem; line-height: 1.6; color: var(--ink); text-wrap: balance; }
.home-author { margin: 10px 0 0; font-size: .85rem; letter-spacing: .12em; color: var(--muted); }
.chips { list-style: none; margin: 18px 0 0; padding: 0; display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
.chips li { border: 1.5px dashed var(--line); border-radius: 999px; padding: 4px 12px; font-size: .78rem; color: var(--muted); }
.home-actions { margin-top: 26px; width: min(100%, 340px); display: flex; flex-direction: column; gap: 12px; }
.btn { min-height: 52px; border-radius: 999px; border: 2px solid var(--btn-bg); padding: 0 20px; font-weight: 700; font-size: 1rem; cursor: pointer; }
.btn.primary { background: var(--btn-bg); color: var(--btn-fg); }
.btn.ghost { background: transparent; color: var(--head); border-color: var(--line); }
.btn.ghost:hover { border-color: var(--accent); }

/* ---------- reader ---------- */
.reader { height: 100%; display: flex; flex-direction: column; }
.progress { height: 3px; background: var(--rule); }
.progress i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .25s ease; }
.runhead, .bar-in { width: min(100%, 760px); margin: 0 auto; }
.runhead { display: flex; justify-content: space-between; gap: 12px; padding: 10px max(20px, env(safe-area-inset-left, 0px)) 0; font-size: .72rem; color: var(--muted); }
.runhead span:first-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.runhead span:last-child { flex: none; }
.stage { flex: 1; min-height: 0; display: flex; justify-content: center; padding: 8px 0; }
.sheet { position: relative; width: min(100%, 760px); height: 100%; background: var(--paper); border-radius: 10px; box-shadow: var(--shadow); overflow: hidden; cursor: default; }
.vp { position: absolute; inset: 0; overflow: hidden; }
.cols { column-fill: auto; will-change: transform; }
.bar { padding: 4px max(12px, env(safe-area-inset-left, 0px)) 8px; }
.bar-in { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
.bar-group { display: flex; align-items: center; gap: 4px; }
.ib { min-width: 44px; min-height: 44px; border: 0; border-radius: 12px; background: transparent; color: var(--head); font-weight: 700; font-size: .85rem; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; padding: 0 8px; }
.ib:hover:not(:disabled) { background: var(--tint); }
.ib:disabled { opacity: .3; cursor: default; }
.ib svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.pager { font-size: .82rem; color: var(--muted); font-variant-numeric: tabular-nums; min-width: 56px; text-align: center; }
@media (max-width: 760px) {
  .reader { background: var(--paper); }
  .sheet { border-radius: 0; box-shadow: none; }
  .stage { padding: 0; }
}

/* ---------- book typography (inside .cols) ---------- */
.cols { font-family: var(--serif); font-size: var(--fs); line-height: 1.95; color: var(--ink); line-break: strict; overflow-wrap: anywhere; text-align: justify; }
.cols > *:first-child { margin-top: 0; }
.cols h1 { font-family: var(--sans); font-size: 1.45em; line-height: 1.55; color: var(--head); margin: .2em 0 .4em; text-align: left; text-wrap: balance; }
.cols .byline { font-family: var(--sans); font-size: .8em; color: var(--muted); margin: 0 0 1.2em; text-indent: 0; text-align: left; }
.cols h2 { position: relative; font-family: var(--sans); font-size: 1.12em; line-height: 1.6; font-weight: 700; color: var(--ink); margin: 1.6em 0 .8em; padding: 0 0 .5em 1.2em; border: 0; border-bottom: 2px dashed var(--line); text-align: left; break-after: avoid; }
.cols h2::before { content: ""; position: absolute; left: .1em; top: .62em; width: .62em; height: .62em; border-radius: 50%; background: var(--accent); }
.cols h2.opener { display: flex; align-items: center; gap: .8em; padding-left: 0; font-size: 1.18em; }
.cols h2.opener::before { display: none; }
.badge { flex: none; width: 2.3em; height: 2.3em; border-radius: 50%; border: 2px solid var(--accent); color: var(--accent); display: inline-flex; align-items: center; justify-content: center; font-size: .9em; font-weight: 700; font-variant-numeric: tabular-nums; }
.cols p { margin: .7em 0; text-indent: 1em; }
.cols p.note { font-size: .9em; color: var(--muted); }
.cols .emph { font-weight: 700; color: var(--head); }
.cols ul, .cols ol { margin: .8em 0; padding-left: 1.5em; }
.cols li { margin: .55em 0; text-align: left; break-inside: avoid; }
.cols table { width: 100%; border-collapse: collapse; margin: 1em 0; font-family: var(--sans); font-size: .82em; line-height: 1.55; break-inside: avoid; text-align: left; }
.cols th, .cols td { border: 1px solid var(--rule); padding: .5em .55em; vertical-align: top; }
.cols th { background: var(--th-bg); color: var(--th-fg); font-weight: 700; }
.cols td.num, .cols th.num { text-align: right; }
.cols tr.total td { font-weight: 700; background: var(--tint); }
.cols figure { margin: 1.1em 0; text-align: center; break-inside: avoid; }
.cols figure img { display: block; margin: 0 auto; max-width: 100%; width: auto; height: auto; max-height: calc(var(--hc, 600px) * .64); border-radius: 8px; background: #fff; border: 1px solid var(--rule); }
.cols figcaption { font-family: var(--sans); font-size: .74em; line-height: 1.5; color: var(--muted); margin-top: .5em; text-indent: 0; }
.cols .summary li { font-weight: 700; }

/* ---------- contents panel ---------- */
.toc { position: fixed; inset: 0; z-index: 20; display: flex; justify-content: center; align-items: flex-end; background: rgba(10, 16, 26, .5); }
.toc-panel { width: min(100%, 560px); max-height: 86%; display: flex; flex-direction: column; background: var(--paper); color: var(--ink); border-radius: 18px 18px 0 0; box-shadow: var(--shadow); padding-bottom: env(safe-area-inset-bottom, 0px); }
.toc-head { display: flex; align-items: center; justify-content: space-between; padding: 14px max(20px, env(safe-area-inset-left, 0px)) 6px; }
.toc-head h2 { margin: 0; font-size: 1.05rem; color: var(--head); }
.toc-list { list-style: none; margin: 0; padding: 0 0 8px; overflow-y: auto; }
.toc-list button { width: 100%; text-align: left; background: none; border: 0; border-top: 1px solid var(--rule); padding: 13px max(20px, env(safe-area-inset-left, 0px)); display: flex; gap: 12px; align-items: baseline; cursor: pointer; line-height: 1.5; }
.toc-list button:hover { background: var(--tint); }
.toc-list .n { flex: none; width: 3.2em; font-size: .75rem; color: var(--accent); font-weight: 700; }
.toc-list [aria-current="true"] { background: var(--tint); font-weight: 700; color: var(--head); }
.toc-foot { padding: 6px max(20px, env(safe-area-inset-left, 0px)) 14px; }
.toc-foot .btn { width: 100%; min-height: 46px; }
@media (min-width: 761px) { .toc { align-items: center; } .toc-panel { border-radius: 18px; } }
@media (prefers-reduced-motion: reduce) { .progress i { transition: none; } }
</style>

<template class="ch" data-title="高単価メニューを入れても、スタッフが動かない理由">
<h1>スタッフが動かない本当の理由は“メリットが見えない”から。自然とスタッフが動き出す給与設計の秘密</h1>
<p class="byline">Oct 9, 2026 · @sasakoma</p>
<h2>高単価メニューを入れても、スタッフが動かない理由</h2>
<p>高単価メニューを導入してもリピート率が伸びない原因は、技術の差ではなく、スタッフに「自分のメリット」が見えていないことです。</p>
<p>次回予約率70%は、リピート率に直すと80〜85%、うまくいけば87%前後に相当するのが目安です。オーナーにとっては大きな成果ですが、スタッフから見ると、やり方が変わる負担だけが増えて、給与は変わりません。これでは動く理由がありません。</p>
<p>この記事では、売上に比例して給与が決まる設計を、数字つきで解説します。技術売上の35%を給与にする基本ルール、店販のプール方式、利益がどれだけ残るかのモデルケース、そして導入時の注意点までを順に説明します。</p>
</template>
<template class="ch" data-title="変化は苦痛。人はメリットを自覚したときだけ動く">
<h2>変化は苦痛。人はメリットを自覚したときだけ動く</h2>
<p>スタッフが新しい施策に乗らない最大の理由は、変化そのものが苦痛だからです。</p>
<p>人を動かす方法は大きく2つあります。1つは「やりたくないよね。でも一緒にやってみよう」と寄り添う共感。もう1つは、本人に「自分にとって得だ」と自覚してもらうことです。共感は人間力に左右されるので、オーナーの調子や相性で結果が変わります。再現できるのは、後者の仕組みづくりです。</p>
<p>特に「どうせ私は時給だから」と感じているパートやアルバイトにとって、売上や次回予約率が上がっても生活が変わらないなら、変化に付き合う理由はありません。</p>
</template>
<template class="ch" data-title="「お金の話は嫌い」の正体は、正当に評価されたい気持ち">
<h2>「お金の話は嫌い」の正体は、正当に評価されたい気持ち</h2>
<p>給与設計の話をすると、「うちのスタッフはお金のために働いていない」「技術で食べているので、お金だけで動きたくない」と返されることがあります。</p>
<p>これは、お金そのものを拒んでいるのではありません。本当に求めているのは、頑張りを正当に評価してほしいということです。給与は、その評価をいちばん分かりやすく示す手段です。</p>
<p>「頑張ったな」という言葉は、誰にでも無料で言えます。言葉と同時に、成果に比例して給与も上がってこそ、評価が本気だと伝わります。大切なのは、パートでも社員並みに稼げる風土をつくることです。</p>
</template>
<template class="ch" data-title="基本ルール：技術売上の35%を給与にする">
<h2>基本ルール：技術売上の35%を給与にする</h2>
<p>給与は、技術売上（メニューの売上）の35%とします。内訳は、30%を毎月の給与、残り5%を賞与です。誰が担当しても、この比率は同じです。</p>
<p>月に100万円の技術売上を上げたスタッフを例にすると、次のようになります。</p>

<tr><td>賞与の積立</td><td>100万円 × 5%</td><td class="num">月5万円</td></tr>
<tr><td>賞与（3ヶ月ごと）</td><td>5万円 × 3ヶ月</td><td class="num">15万円</td></tr>
<tr><td>賞与（半年ごと）</td><td>5万円 × 6ヶ月</td><td class="num">30万円（1ヶ月分）</td></tr>
<tr class="total"><td>給与の合計</td><td>100万円 × 35%</td><td class="num">35万円</td></tr>

<template class="ch" data-title="店販は売上の10%。半分は店全体のプールにする">
<h2>店販は売上の10%。半分は店全体のプールにする</h2>
<p>店販（商品販売）の給与は、店販売上の10%です。ここに1つ工夫を入れます。</p>
<ul>
<li>5%は、売った本人の毎月の給与に加えます。店販を20万円売ったスタッフなら、月1万円の上乗せです。</li>

<p>プールは、スタッフの出勤日数や出勤時間に比例して分配します。店販だけを買いに来たお客様に対応するのは、受付のスタッフです。その売上が受付のアルバイトの賞与にも届くので、全員が同じ方向を向きやすくなります。</p>

<template class="ch" data-title="ライバルが仲間になる2つの理由">
<h2>ライバルが仲間になる2つの理由</h2>
<p>売上に比例する給与にすると、店の空気が変わります。理由は2つあります。</p>
<ol>
<li><span class="emph">競争が健全で平等になり、派閥がなくなる。</span> 評価の基準が、技術売上と次回予約率だけになります。誰が好かれているか、誰が楽をしているかを気にする必要がなくなり、不透明な比較から生まれる格差意識や派閥が消えていきます。</li>
<li><span class="emph">売上を上げる行動に集中できる。</span> 他のスタッフの動きや自分の大変さに向いていた意識が、リピート率や店販を増やす行動に向かいます。「リピート率を上げれば自分の給与が上がる」と自覚できるからです。</li>
</ol>
<p>さらに、成果の出ているやり方を全員が真似し合えば、全員の売上と給与が上がります。数字で学び合う空気が生まれます。「お前のリピート率は何%？」が、責める言葉ではなく学び合いの言葉に変わります。</p>
</template>

<h2>数字で確認：給与35%でも利益は残るのか</h2>
<p>結論から言うと、客単価が高いほど利益率は上がり、客単価1.5万円なら売上の4割弱が残ります。</p>

<template class="ch" data-title="指名制をやめ、同一メニュー・同一価格にする">
<h2>指名制をやめ、同一メニュー・同一価格にする</h2>
<p>この設計は、「誰が担当しても同じリピート率と売上が出る」仕組みとセットで機能します。特定のカリスマを育てる店では、成り立ちません。</p>
<p>店長だけ料金が高い店では、店長がスターになり、現場を引退できなくなります。お客様も、「別のスタッフでもいいですか」と聞かれて納得できません。同じメニューなら、店長も入社半年のスタイリストも同じ価格にします。</p>
<p>お客様には「再来週の水曜日なら田中が担当しますが、仕上がりに違いはありません」と伝えます。それでも「あなたがいい」と言われた場合だけ、その人に付けます。導入初期でスケジュールに余裕があるときは、次回予約を取ったスタッフの売上にします。余裕が出てきたら、店全体で担当を調整するチーム運営に移ります。</p>
<p>人の育成も同じ考え方です。中途採用は3ヶ月、新卒は6ヶ月を目安にデビューさせ、受付やアシスタントを多く置きません。下積みの期間が長いほど効率が悪く、お客様が店内でたらい回しにされる感覚も生まれます。</p>
</template>

<ol>
<li><span class="emph">短期：数字を見える化する。</span> 1人あたりの技術売上、次回予約率、客単価、店販を集計し、全員に共有します。月1回の振り返りの場も決めます。</li>
<li><span class="emph">短期：給与ルールを紙1枚にする。</span> 技術売上の30%を毎月、5%を賞与、店販は5%＋5%のプール、という内容を、月100万円の具体例つきで明文化します。</li>
<li><span class="emph">中期：指名制をやめる。</span> 同一メニュー・同一価格に揃え、次回予約を取った人に売上を付けるなど、導入初期のルールも決めます。</li>
<li><span class="emph">中期：成功ノウハウを標準化する。</span> 成果の出ているトークや提案の手順を全員で共有し、マニュアルにします。</li>
<li><span class="emph">長期：育成と体制を整える。</span> 中途3ヶ月・新卒6ヶ月でデビューできる育成にし、店長が現場を離れても利益が残る構造を目指します。</li>
</ol>

<template class="ch" data-title="導入前に知っておきたい4つの注意点">
<h2>導入前に知っておきたい4つの注意点</h2>
<p>売上比例の設計には、次のような弱点もあります。先に手当てしておくと失敗しにくくなります。</p>
<ul>
<li><span class="emph">売上だけを追う行動が出る。</span> 測られる数字は操作されやすくなります。次回予約率やお客様の満足度も併せて見て、指標は定期的に見直します。</li>
<li><span class="emph">ノウハウや顧客の抱え込み。</span> 個人の技術売上だけを競うと、情報を隠す動きが出ます。店販のプールのように、店全体で分け合う枠を技術側にも少し持たせたり、ノウハウ共有を評価に入れたりします。</li>
<li><span class="emph">閑散期や新人の収入が下がる。</span> 生活が不安定になると定着しません。最低保証や、段階的な導入を検討します。</li>
<li><span class="emph">トップ層が物足りなくなる。</span> 同一価格だと、成果の高いスタッフの伸びしろが見えにくくなります。教育担当などの役割を用意します。</li>
</ul>
</template>
<template class="ch" data-title="まとめ">
<h2>まとめ</h2>
<p>スタッフを動かすのは、熱意でも説得でもなく、メリットが見える設計です。</p>
<ul class="summary">
<li>給与は技術売上の35%（毎月30%＋賞与5%）、店販は10%（個人5%＋店全体のプール5%）</li>
<li>評価の基準が数字に一本化され、派閥や格差意識が消える</li>
<li>指名制をやめ、同一メニュー・同一価格にして、カリスマ依存から抜ける</li>
<li>客単価が上がるほど利益率も上がるため、35%でも店に利益が残る</li>
</ul>
<p>まずは自店の技術売上・次回予約率・客単価を数字にして、全員に見せるところから始めてみてください。</p>
</template>

<script>
(function () {
  var $ = function (s) { return document.querySelector(s); };
  var home = $('#home'), reader = $('#reader'), sheet = $('#sheet'), cols = $('#cols');
  var tocEl = $('#toc'), tocList = $('#toc-list');
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

  var tpls = Array.prototype.slice.call(document.querySelectorAll('template.ch'));
  var chapters = tpls.map(function (t) {
    return { title: t.dataset.title, html: t.innerHTML, chars: t.content.textContent.replace(/\s+/g, '').length };
  });
  var total = chapters.reduce(function (a, c) { return a + c.chars; }, 0);
  var cum = []; chapters.reduce(function (a, c, i) { cum[i] = a; return a + c.chars; }, 0);

  var fs = parseInt(lsGet('sk-fs'), 10) || (window.innerWidth < 600 ? 17 : 18);
  function setFs(v) { fs = Math.max(14, Math.min(24, v)); document.documentElement.style.setProperty('--fs', fs + 'px'); lsSet('sk-fs', String(fs)); }
  setFs(fs);

  var st = { c: 0, p: 0, pages: 1, W: 0, gap: 0 };
  var token = 0;

  /* ----- cover screen ----- */
  $('#chip-n').textContent = '全' + chapters.length + '節';
  $('#chip-c').textContent = '約' + (Math.round(total / 100) * 100).toLocaleString('ja-JP') + '字';
  $('#chip-t').textContent = '読了目安 約' + Math.max(1, Math.round(total / 500)) + '分';

  function savedPos() {
    try { var o = JSON.parse(lsGet('sk-pos')); if (o && o.c >= 0 && o.c < chapters.length) return o; } catch (e) {}
    return null;
  }
  var sp = savedPos();
  if (sp && (sp.c > 0 || sp.f > 0.01)) $('#btn-resume').hidden = false;

  /* ----- layout / pagination ----- */
  function decorate(c) {
    var h = cols.querySelector('h2');
    if (!h) return;
    h.classList.add('opener');
    var b = document.createElement('span');
    b.className = 'badge'; b.setAttribute('aria-hidden', 'true'); b.textContent = String(c + 1);
    h.insertBefore(b, h.firstChild);
  }
  function measure() {
    var W = sheet.clientWidth, Hs = sheet.clientHeight;
    var P = W < 520 ? 22 : 48, PT = 22, PB = 18;
    var vp = cols.parentElement;
    vp.style.padding = PT + 'px ' + P + 'px ' + PB + 'px';
    var colW = W - 2 * P, Hc = Hs - PT - PB;
    cols.style.width = colW + 'px';
    cols.style.height = Hc + 'px';
    cols.style.columnWidth = colW + 'px';
    cols.style.columnGap = (2 * P) + 'px';
    cols.style.setProperty('--hc', Hc + 'px');
    st.W = W; st.gap = 2 * P;
    st.pages = Math.max(1, Math.round((cols.scrollWidth + st.gap) / W));
  }
  function settle() {
    var imgs = Array.prototype.slice.call(cols.querySelectorAll('img'));
    var decodes = imgs.map(function (i) { return i.decode ? i.decode().catch(function () {}) : Promise.resolve(); });
    var fonts = document.fonts && document.fonts.ready ? document.fonts.ready.catch(function () {}) : Promise.resolve();
    return Promise.all(decodes.concat([fonts, new Promise(function (r) { requestAnimationFrame(function () { requestAnimationFrame(r); }); })]));
  }
  function apply(anim) {
    cols.style.transition = (anim && !reduce) ? 'transform .28s cubic-bezier(.2,.7,.2,1)' : 'none';
    cols.style.transform = 'translateX(' + (-st.p * st.W) + 'px)';
    var left = st.pages - 1 - st.p;
    $('#rh-rest').textContent = left === 0 ? 'この節の最後のページ' : 'この節 残り' + left + 'ページ';
    $('#pager').textContent = (st.p + 1) + ' / ' + st.pages;
    var last = st.c === chapters.length - 1;
    $('#btn-prev').disabled = (st.c === 0 && st.p === 0);
    $('#btn-next').disabled = (last && st.p === st.pages - 1);
    var frac = (st.p + 1) / st.pages;
    $('#prog').style.width = (((cum[st.c] + frac * chapters[st.c].chars) / total) * 100).toFixed(1) + '%';
    lsSet('sk-pos', JSON.stringify({ c: st.c, f: st.p / st.pages }));
  }
  function openChapter(c, where) {
    var my = ++token;
    st.c = c;
    cols.innerHTML = chapters[c].html;
    decorate(c);
    $('#rh-title').textContent = '第' + (c + 1) + '節　' + chapters[c].title;
    return settle().then(function () {
      if (my !== token) return;
      measure();
      if (where === 'end') st.p = st.pages - 1;
      else if (typeof where === 'number' && where > 0) st.p = Math.min(st.pages - 1, Math.floor(where * st.pages));
      else st.p = 0;
      apply(false);
    });
  }
  function relayout() {
    if (reader.hidden) return;
    var f = st.p / st.pages;
    measure();
    st.p = Math.min(st.pages - 1, Math.floor(f * st.pages + 1e-6));
    apply(false);
  }
  function next() {
    if (st.p < st.pages - 1) { st.p++; apply(true); }
    else if (st.c < chapters.length - 1) openChapter(st.c + 1, 'start');
  }
  function prev() {
    if (st.p > 0) { st.p--; apply(true); }
    else if (st.c > 0) openChapter(st.c - 1, 'end');
  }

  /* ----- views ----- */
  function showReader(c, where) {
    home.hidden = true; reader.hidden = false; tocEl.hidden = true;
    return openChapter(c, where);
  }
  function showHome() {
    reader.hidden = true; tocEl.hidden = true; home.hidden = false;
    var s = savedPos();
    $('#btn-resume').hidden = !(s && (s.c > 0 || s.f > 0.01));
  }
  var tocOpener = null;
  function buildToc() {
    tocList.innerHTML = '';
    chapters.forEach(function (c, i) {
      var li = document.createElement('li');
      var b = document.createElement('button');
      b.type = 'button';
      b.innerHTML = '<span class="n">第' + (i + 1) + '節</span><span></span>';
      b.lastChild.textContent = c.title;
      if (!reader.hidden && i === st.c) b.setAttribute('aria-current', 'true');
      b.addEventListener('click', function () { showReader(i, 'start'); });
      li.appendChild(b); tocList.appendChild(li);
    });
  }
  function openToc() {
    tocOpener = document.activeElement;
    buildToc(); tocEl.hidden = false;
    var cur = tocList.querySelector('[aria-current="true"]') || tocList.querySelector('button');
    if (cur) { cur.focus(); cur.scrollIntoView({ block: 'center' }); }
  }
  function closeToc() { tocEl.hidden = true; if (tocOpener && tocOpener.focus) tocOpener.focus(); }

  $('#btn-start').addEventListener('click', function () { showReader(0, 'start'); });
  $('#btn-resume').addEventListener('click', function () { var s = savedPos() || { c: 0, f: 0 }; showReader(s.c, s.f); });
  $('#btn-toc-home').addEventListener('click', openToc);
  $('#btn-toc').addEventListener('click', openToc);
  $('#toc-close').addEventListener('click', closeToc);
  $('#toc-cover').addEventListener('click', showHome);
  tocEl.addEventListener('click', function (e) { if (e.target === tocEl) closeToc(); });
  $('#btn-next').addEventListener('click', next);
  $('#btn-prev').addEventListener('click', prev);
  $('#btn-fs-up').addEventListener('click', function () { setFs(fs + 1); relayoutAfterFont(); });
  $('#btn-fs-down').addEventListener('click', function () { setFs(fs - 1); relayoutAfterFont(); });
  function relayoutAfterFont() { requestAnimationFrame(relayout); }

  /* ----- keyboard, tap zones, swipe ----- */
  document.addEventListener('keydown', function (e) {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (!tocEl.hidden) { if (e.key === 'Escape') closeToc(); return; }
    if (reader.hidden) return;
    var onBtn = e.target && e.target.tagName === 'BUTTON';
    if (e.key === 'ArrowRight' || e.key === 'PageDown') { e.preventDefault(); next(); }
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); prev(); }
    else if (e.key === ' ' && !onBtn) { e.preventDefault(); e.shiftKey ? prev() : next(); }
    else if (e.key === 'Escape') { showHome(); }
  });
  var tx = 0, ty = 0, swipedAt = 0;
  sheet.addEventListener('touchstart', function (e) { var t = e.changedTouches[0]; tx = t.clientX; ty = t.clientY; }, { passive: true });
  sheet.addEventListener('touchend', function (e) {
    var t = e.changedTouches[0], dx = t.clientX - tx, dy = t.clientY - ty;
    if (Math.abs(dx) > 48 && Math.abs(dx) > Math.abs(dy) * 1.4) { swipedAt = Date.now(); dx < 0 ? next() : prev(); }
  }, { passive: true });

  var rt;
